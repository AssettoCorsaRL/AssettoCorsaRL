model:
  num_cells: 256
  lr: 3e-4
  actor_lr: 1e-4
  critic_lr: 1e-4
  max_grad_norm: 1.0

  # pretrained_model: "D:/acrl/AssetoCorsaRL/models/sac_last.pt"
  # pretrained_model: "D:/acrl/AssetoCorsaRL/models/sac_best.pt"
  bc_pretrained_model: null
  pretrained_model: null
  vae_checkpoint_path: "D:/acrl/AssetoCorsaRL/models/loss=0.1050.ckpt" #* IMPORTANT: Path to pretrained encoder to load for VAE training
  # replay_buffer_path: "D:/acrl/AssetoCorsaRL/models/replay_buffer_1225061.pkl"
  replay_buffer_path: null

  #* expert demonstrations (always in buffer)
  use_expert_demonstrations: false # enable loading expert demos into replay buffer
  expert_demonstrations_path: "D:/acrl/AssetoCorsaRL/datasets/demonstrations" # path to directory containing demo_batch_*.npz files
  expert_demo_subsample: null # sample every Nth frame from expert demos (null = use all)
  expert_demo_epsilon: 0.01 # expert PER priority = current max priority + this epsilon
  expert_priority_refresh_updates: 1000 # refresh expert PER priority every N gradient updates (annealed to 0 bonus over training)

  gamma: 0.99
  tau: 0.01

  alpha: 0.2
  alpha_lr: 3e-4
  alpha_min: 1e-4
  alpha_max: 1.0

  batch_size: 128
  replay_size: 750_000

  updates_per_step: 1
  actor_update_delay: 2
  max_updates_per_tick: 8 # baseline learner headroom; adaptive logic scales this by queue pressure
  max_update_credit: 256 # max queued learner updates to absorb temporary collector spikes
  drain_max_items: 16384 # max queue items drained per learner loop iteration
  adaptive_updates: true # scale learner update cap from queue fill ratio
  adaptive_queue_low: 0.35 # below this ratio, learner relaxes update cap
  adaptive_queue_high: 0.75 # above this ratio, learner boosts update cap
  adaptive_scale_up: 2.0 # multiplier when queue is high
  adaptive_scale_down: 0.5 # multiplier when queue is low
  adaptive_max_updates_per_tick: 32 # hard cap for adaptive boosts
  max_items: 32768

  freeze_encoder_steps: 10

  load_initial: true

  use_per: false # use Priority Experience Replay (true) or uniform replay (false)

  per_alpha: 0.1 # less aggressive prioritization for stability
  per_beta: 0.6
  per_max_priority: 100.0 # clip PER priorities to prevent runaway sampling

  #* noisy - IGNORE IF use_noisy=false
  use_noisy: false
  noise_sigma: 0.45

  #* exploration - IGNORE IF use_noisy=true
  explore_start: 0.20
  explore_end: 0.05
  explore_steps: 400_000

  #* Ornstein-Uhlenbeck exploration noise (temporally correlated)
  ou_theta: 0.2 # mean-reversion speed (higher = less autocorrelation, faster reversion to mean)
  ou_sigma: [0.3, 0.3, 0.1]
  ou_mu: [0, 0.7, 0] # drift towards throttle (steer centered at 0)
  ou_noise_scale: 0.35 # initial scale for additive noise after start_steps
  ou_noise_decay_steps: 250000 # steps over which additive OU noise decays to zero

  #TODO: remove ts
  min_q_target: -5000000 # don't clip, it doesn't do anything anyway
  max_q_target: 200000000

  cumul_memories_used: 0
  cumul_memories_should_have_been_used: 0

  compile_models: false
  compile_mode: "reduce-overhead" # default | reduce-overhead | max-autotune

  lr_scheduler: "none" # cosine | linear | none
  lr_warmup_steps: 0 # gradient-update steps of linear warmup (0 to disable)
  lr_min_factor: 0.05 # minimum LR = initial_lr * lr_min_factor
