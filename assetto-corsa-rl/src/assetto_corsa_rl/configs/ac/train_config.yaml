train:
  start_steps: 10_000 # number of random action steps to collect before training begins
  total_steps: 2_000_000
  log_interval: 1000 # how often (in steps) to print/log training stats
  log_update_every: 500 # how often (in gradient updates) to log loss metrics (higher = less logging overhead)
  save_interval: 50_000 # how often (in steps) to save model checkpoints
  save_interval_replaybuffer: null # how often (in steps) to save the replay buffer (null = disabled)

  min_free_space_gb: 30 # minimum free disk space to maintain (in GB)

  seed: 6741
  device: null # null = auto-select (GPU if available, else CPU) use gpu:id or cpu to force
  collector_device: null # null = auto (cpu when learner uses cuda), or set explicit cpu/cuda:id

  wandb:
    enabled: true
    project: "AssetoCorsaRL-AssettoCorsa"
    entity: null
    name: null

  checkpoint_dir: "models"

  use_async: true # set to true to run collector + learner as separate processes (torch.multiprocessing)
  queue_size: 65536 # max transitions in the inter-process queue before back-pressure kicks in
  queue_batch_size: 64 # transitions per queue payload from collector to learner
  queue_batch_max_delay_steps: 4 # flush batch even if small after N collector steps
  sync_every: 200 # collector syncs actor weights from shared memory every N steps

  # ── wandb sweep ────────────────────────────────────────────────────────────
  # Number of trials this agent will run when calling `acrl ac sweep`.
  # Set WANDB_SWEEP_ID env-var to join an existing sweep instead of creating one.
  sweep_count: 20

  # ── CPU inference optimization ──────────────────────────────────────────────
  cpu_num_threads: 3 # threads for CPU inference (lower = cheaper collector CPU cost)
  cpu_inference_backend: "eager" # compile | jit | eager (used by collector SACInferenceEngine on CPU)
  quantize_actor: false # INT8 quantization for actor (faster but slightly less accurate)
  quantize_cnn_only: false # Quantize only frozen CNN encoder (safe, recommended)

  ac_reset_interval_steps: 50000
  ac_startup_wait: 20.0
